[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://code.do9ita.de/Tom/zaehler"
publish = false

# Abhängigkeiten der Crates gemäß ADR_022; geprüft in
# crates/zaehler-server/tests/architecture.rs
# @impl SPEC_ARCH_LAYERS
[workspace.dependencies]
zaehler-domain = { path = "crates/zaehler-domain" }
zaehler-db = { path = "crates/zaehler-db" }
zaehler-ai = { path = "crates/zaehler-ai" }
zaehler-app = { path = "crates/zaehler-app" }
zaehler-notify = { path = "crates/zaehler-notify" }
zaehler-web = { path = "crates/zaehler-web" }
zaehler-storage = { path = "crates/zaehler-storage" }
zaehler-media = { path = "crates/zaehler-media" }

anyhow = "1"
askama = "0.16"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
dotenvy = "0.15"
figment = { version = "0.10", features = ["env", "toml"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
object_store = { version = "0.14", features = ["aws"] }
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust_decimal = { version = "1", features = ["maths", "serde-with-str"] }
rust_decimal_macros = "1"
sea-orm = { version = "2", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite", "with-chrono", "with-uuid"] }
sea-orm-migration = { version = "2", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
time = "0.3"
tower-sessions = { version = "0.15", default-features = false }
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip", "request-id", "timeout"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
