apiVersion: v1
kind: Service
metadata:
  name: {{ include "zaehler.fullname" . }}
  labels:
    {{- include "zaehler.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
  selector:
    {{- include "zaehler.selectorLabels" . | nindent 4 }}
