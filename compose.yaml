# @impl SPEC_OPS_COMPOSE
# Standard-Setup: SQLite + lokale Dateiablage in einem Volume.
#
#   docker compose up -d --build
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d   # PostgreSQL statt SQLite
#
# Weitere Overrides: compose.s3.yaml (S3-Objektspeicher), compose.otel.yaml
# (OpenTelemetry-Collector), compose.keycloak.yaml (OIDC mit Keycloak),
# compose.mail.yaml (Mailpit für E-Mails).
#
# Geheimnisse (OpenRouter-Key, OIDC, SMTP) in .env ablegen, siehe .env.example.
# COMPOSE_HTTP_PORT ändert den Port auf dem Host, COMPOSE_APP_ENV_FILE die
# Datei mit den Variablen für den Container.
# Ohne OIDC-Konfiguration ist der Entwicklungs-Login aktiv; er ist nur mit
# einer public_url auf localhost zulässig. Für andere Adressen OIDC in .env
# konfigurieren und ZAEHLER_AUTH__DEV_LOGIN=false setzen.

services:
  zaehler:
    image: ${ZAEHLER_IMAGE:-zaehler:dev}
    build: .
    restart: unless-stopped
    ports:
      - "${COMPOSE_HTTP_PORT:-8080}:8080"
    env_file:
      - path: ${COMPOSE_APP_ENV_FILE:-.env}
        required: false
    environment:
      ZAEHLER_LOG__FORMAT: pretty
      ZAEHLER_SERVER__PUBLIC_URL: ${ZAEHLER_SERVER__PUBLIC_URL:-http://localhost:8080}
      ZAEHLER_AUTH__DEV_LOGIN: ${ZAEHLER_AUTH__DEV_LOGIN:-true}
      ZAEHLER_DATABASE__URL: sqlite:///var/lib/zaehler/data/zaehler.db?mode=rwc
      ZAEHLER_STORAGE__KIND: fs
      ZAEHLER_STORAGE__PATH: /var/lib/zaehler/data/files
      ZAEHLER_BACKUP__DIR: /var/lib/zaehler/data/backups
    volumes:
      - zaehler-data:/var/lib/zaehler/data

volumes:
  zaehler-data:
