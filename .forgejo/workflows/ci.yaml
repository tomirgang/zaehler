# Forgejo Actions (GitHub-Actions-kompatibel). Runner-Label "docker" ggf. anpassen.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: docker
    container:
      image: rust:1.98-trixie
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zaehler
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ZAEHLER_TEST_S3_ENDPOINT: http://127.0.0.1:7070
      ZAEHLER_TEST_S3_BUCKET: zaehler-test
      ZAEHLER_TEST_S3_ACCESS_KEY: zaehler
      ZAEHLER_TEST_S3_SECRET_KEY: zaehler-test
      ZAEHLER_TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/zaehler
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      # clippy.toml verbietet SQL aus Zeichenketten
      # @test SPEC_SEC_SQL_PARAMS
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # S3-kompatibler Server für den Objektspeicher-Test (MinIO wird nicht
      # mehr verteilt); Backend posix: ein Verzeichnis je Bucket
      - name: S3-Testserver (Versity Gateway)
        env:
          VGW: versitygw_v1.9.0_Linux_x86_64
          VGW_SHA256: 0c28ccda3452451d7c71a0427f6aa7d0db5cac5e2b98a8e4dd2970967e1aadc1
        run: |
          curl -fsSLo /tmp/vgw.tar.gz https://github.com/versity/versitygw/releases/download/v1.9.0/$VGW.tar.gz
          echo "$VGW_SHA256  /tmp/vgw.tar.gz" | sha256sum -c -
          tar xzf /tmp/vgw.tar.gz -C /tmp
          mkdir -p /tmp/s3/$ZAEHLER_TEST_S3_BUCKET
          ROOT_ACCESS_KEY=$ZAEHLER_TEST_S3_ACCESS_KEY ROOT_SECRET_KEY=$ZAEHLER_TEST_S3_SECRET_KEY \
            nohup /tmp/$VGW/versitygw --port 127.0.0.1:7070 posix /tmp/s3 > /tmp/versitygw.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null $ZAEHLER_TEST_S3_ENDPOINT && exit 0; sleep 1; done
          cat /tmp/versitygw.log; exit 1
      - run: cargo test --workspace --locked

  # Leistungsbudget: Release-Build, SQLite und PostgreSQL; meldet p95 je
  # Seite, eine Überschreitung lässt den Job fehlschlagen
  # @impl SPEC_PERF_BUDGET
  perf:
    runs-on: docker
    container:
      image: rust:1.98-trixie
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zaehler
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ZAEHLER_TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/zaehler
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --release --locked -p zaehler-server perf_ -- --ignored --nocapture

  # Auslieferung mit docker compose (SQLite; PostgreSQL mit S3 und OTel)
  # @test SPEC_OPS_COMPOSE, SPEC_OPS_IMAGE
  smoke:
    needs: [rust]
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: deploy/smoke-test.sh
      - run: deploy/smoke-test.sh compose.postgres.yaml compose.s3.yaml compose.otel.yaml
      # zwei Instanzen gegen dieselbe Datenbank: genau ein Leader, eine E-Mail
      # @test SPEC_OPS_REPLICAS
      - run: deploy/smoke-test.sh compose.postgres.yaml compose.s3.yaml compose.mail.yaml compose.replicas.yaml

  # Barrierefreiheit aller Seiten mit axe-core (WCAG 2.2 AA); Verstöße
  # serious/critical, CSP-Verstöße und nicht gezeichnete Diagramme brechen ab
  # @test SPEC_A11Y
  a11y:
    needs: [rust]
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest
    env:
      COMPOSE_APP_ENV_FILE: /dev/null
      COMPOSE_HTTP_PORT: "18081"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: docker compose --env-file /dev/null -p a11y up -d --build --wait
      - name: axe-core über Playwright im Compose-Netz
        run: |
          id=$(docker create --network a11y_default -e ZAEHLER_URL=http://zaehler:8080 -w /work \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            sh -c "npm ci --no-audit --no-fund && node a11y.mjs")
          docker cp tests/browser/. "$id:/work"
          docker start -a "$id"
      - if: always()
        run: docker compose --env-file /dev/null -p a11y down -v

  docs:
    runs-on: docker
    container:
      image: ghcr.io/astral-sh/uv:python3.13-trixie
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends graphviz
      # -W: Warnungen (u.a. tote Trace-Links, Schema-Verletzungen) brechen den Build
      # @test SPEC_DOC_TRACING
      - run: uv run --project docs sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

  mermaid:
    runs-on: docker
    container:
      image: ghcr.io/mermaid-js/mermaid-cli/mermaid-cli:11.12.0
    env:
      MMDC: /home/mermaidcli/node_modules/.bin/mmdc
      MMDC_ARGS: -p /puppeteer-config.json
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      # Mermaid rendert im Browser; Syntaxfehler fallen im Sphinx-Build nicht auf
      - run: node docs/tools/check-mermaid.mjs docs

  # @test SPEC_OPS_HELM
  helm:
    runs-on: docker
    container:
      image: alpine/helm:3.19.0
    env:
      OIDC: oidc.enabled=true,oidc.issuerUrl=https://idp.example.com/realms/home,oidc.existingSecret=zaehler-oidc
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: helm lint deploy/helm/zaehler --set "$OIDC"
      - run: helm lint deploy/helm/zaehler --set "$OIDC" --set database.type=sqlite
      - run: helm lint deploy/helm/zaehler --set "$OIDC" --set storage.kind=s3,replicaCount=2
      - run: >-
          helm lint deploy/helm/zaehler --set "$OIDC" --set storage.kind=s3,replicaCount=2
          --set database.type=existing,database.existing.secretName=pg,database.lockUrl.secretName=pg-direct
          --set notify.smtp.enabled=true,notify.smtp.host=mail.example.com,notify.smtp.existingSecret=smtp
      # ohne OIDC muss das Chart die Installation verweigern
      - run: "! helm template t deploy/helm/zaehler"
      # @test SPEC_OPS_BACKUP_CNPG
      - run: >-
          helm lint deploy/helm/zaehler --set "$OIDC"
          --set otel.endpoint=http://otel-collector:4318,session.cookieSecure=true
          --set database.cnpg.backup.barmanObjectStore.destinationPath=s3://backup/zaehler
          --set database.cnpg.scheduledBackup.enabled=true
      # Sicherungsplan ohne Sicherungsziel wird verweigert
      - run: '! helm template t deploy/helm/zaehler --set "$OIDC" --set database.cnpg.scheduledBackup.enabled=true'

  image:
    needs: [rust, perf, smoke, docs, mermaid, helm]
    if: github.event_name == 'push'
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://github.com/docker/setup-qemu-action@v3
      - uses: https://github.com/docker/setup-buildx-action@v3
      - uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || github.server_url }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - id: meta
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: ${{ vars.IMAGE || format('{0}/{1}', vars.REGISTRY, github.repository) }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
