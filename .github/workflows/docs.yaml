# Veröffentlicht die Sphinx-Dokumentation auf GitHub Pages (GitHub-Spiegel).
# Voraussetzung: Repository-Einstellungen → Pages → Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths: &docs-paths
      - "docs/**"
      # Code-Tracing (docs/_ext/codetrace.py) liest @impl/@test-Marker aus dem Code
      - "crates/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: docs/uv.lock
      # -W: Warnungen (u.a. tote Trace-Links, Schema-Verletzungen) brechen den Build
      - run: uv run --locked --project docs sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
