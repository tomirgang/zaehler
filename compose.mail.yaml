# @impl SPEC_OPS_COMPOSE, SPEC_NTF_EMAIL
# Override für Entwicklung und Smoke-Test: Mailpit nimmt alle E-Mails an und
# zeigt sie unter http://localhost:8025; nichts wird zugestellt.
#   docker compose -f compose.yaml -f compose.mail.yaml up -d
# Versandtest aus dem Workspace gegen denselben Mailpit:
#   ZAEHLER_TEST_SMTP_PORT=1025 cargo test -p zaehler-notify

services:
  zaehler:
    environment:
      ZAEHLER_NOTIFY__SMTP__HOST: mailpit
      ZAEHLER_NOTIFY__SMTP__PORT: "1025"
      ZAEHLER_NOTIFY__SMTP__SECURITY: none
      # Mailpit im Compose-Netz ohne TLS und ohne Zugangsdaten
      ZAEHLER_NOTIFY__SMTP__ALLOW_INSECURE: "true"
      ZAEHLER_NOTIFY__SMTP__FROM: Zähler <zaehler@localhost>
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
