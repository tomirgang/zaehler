# Beispielkonfiguration. Start: zaehler --config config/zaehler.toml
# Jeder Wert kann per Umgebungsvariable überschrieben werden,
# z.B. [database] url  ->  ZAEHLER_DATABASE__URL

[server]
listen = "0.0.0.0:8080"
metrics_listen = "0.0.0.0:9090"
public_url = "http://localhost:8080"

[database]
# url = "postgres://zaehler:secret@localhost:5432/zaehler"
url = "sqlite://data/zaehler.db?mode=rwc"
max_connections = 10
auto_migrate = true

[log]
format = "pretty" # json | pretty
filter = "info,zaehler=debug"

[storage]
kind = "fs"
path = "data/files"
# kind = "s3"
# bucket = "zaehler"
# endpoint = "https://s3.example.com"
# region = "eu-central-1"
# access_key_id = "..."      # sonst AWS_ACCESS_KEY_ID
# secret_access_key = "..."  # besser via ZAEHLER_STORAGE__SECRET_ACCESS_KEY
# allow_http = false

[image]
max_pixels = 2000000
jpeg_quality = 85

[housekeeping]
interval_minutes = 60
draft_ttl_hours = 24

[upload]
max_photo_bytes = 15728640
max_csv_bytes = 5242880
max_backup_bytes = 1073741824

[backup]
# Vollständiges Archiv vor ausstehenden Migrationen
before_migrate = true
dir = "data/backups"
keep = 3

[auth]
# Entwicklungs-Login ohne Identity Provider; nur mit public_url auf localhost
dev_login = false

[session]
ttl_hours = 720
# cookie_secure = true   # Standard: true bei https://, false bei http://

